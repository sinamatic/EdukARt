services:
    edukart-ros2-receiver:
        user: root
        image: eduartrobotik/eduart-robot-control:0.5.0
        network_mode: host
        restart: always
        privileged: true
        ipc: host
        pid: host
        environment:
            - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
            - CYCLONEDDS_URI=/home/user/ros/launch_content/cyclone_profile.xml
        volumes:
            - './edukart_ros2_receiver.py:/opt/edukart/edukart_ros2_receiver.py:ro'
            - '/home/user/edu_nodered_ros2_plugin/docker/iot2050/launch_content:/home/user/ros/launch_content:r'
        command: bash -lc 'source /opt/ros/jazzy/setup.bash && source /home/user/ros/install/setup.bash && exec python3 /opt/edukart/edukart_ros2_receiver.py'
